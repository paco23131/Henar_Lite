<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henar Lite - Lienzo Interactivo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de herramientas superior -->
  <header class="toolbar">
    <div class="brand">Henar Lite</div>
    <div class="actions">
      <button id="add-btn" class="btn primary">+ Añadir Tecla</button>
      <button id="mode-btn" class="btn secondary">Modo: Edición</button>
      <button id="reset-btn" class="btn danger">Limpiar Todo</button>
    </div>
  </header>

  <!-- Espacio vacío (Lienzo interactivo) -->
  <main id="canvas"></main>

  <script src="main.js"></script>
</body>
</html>
